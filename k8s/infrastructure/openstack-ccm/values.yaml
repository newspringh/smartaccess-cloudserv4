# SmartAccess OpenStack Cloud Controller Manager configuration.
# OpenStack credentials are stored in a separate Kubernetes Secret.

cluster:
  name: smartaccess

secret:
  enabled: true
  create: false
  name: openstack-cloud-config

# OpenStack API configuration will be supplied by the Secret.
# No credentials are stored in this file.

# Canal manages Kubernetes pod networking.
# Enable only OpenStack node lifecycle integration initially.
enabledControllers:
  - cloud-node
  - cloud-node-lifecycle

# Run the CCM on Kubernetes control-plane nodes.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.cloudprovider.kubernetes.io/uninitialized
    operator: Exists
    effect: NoSchedule

# RKE2 does not use the default kubeadm certificate and FlexVolume paths.
# Node lifecycle controllers do not require these host mounts.
extraVolumes: []
extraVolumeMounts: []
