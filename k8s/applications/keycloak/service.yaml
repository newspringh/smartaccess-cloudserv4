apiVersion: v1
kind: Service
metadata:
  name: smartaccess-keycloak
  namespace: smartaccess-dev
  labels:
    app.kubernetes.io/name: smartaccess-keycloak
spec:
  type: ClusterIP
  selector:
    app: smartaccess-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
