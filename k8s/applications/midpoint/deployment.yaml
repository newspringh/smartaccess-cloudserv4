apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartaccess-midpoint
  namespace: smartaccess-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smartaccess-midpoint
  template:
    metadata:
      labels:
        app: smartaccess-midpoint
    spec:
      nodeSelector:
        kubernetes.io/hostname: smartaccess-worker03
      securityContext:
        fsGroup: 1000
      containers:
        - name: midpoint
          image: evolveum/midpoint:4.11.1-alpine
          command: ["/opt/midpoint/bin/midpoint.sh", "container"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MP_SET_midpoint_repository_database
              value: postgresql
            - name: MP_SET_midpoint_repository_jdbcUsername
              value: midpoint
            - name: MP_SET_midpoint_repository_jdbcUrl
              value: jdbc:postgresql://smartaccess-postgresql.smartaccess-dev.svc.cluster.local:5432/midpoint
            - name: MP_SET_midpoint_repository_jdbcPassword
              valueFrom:
                secretKeyRef:
                  name: smartaccess-postgresql-credentials
                  key: MIDPOINT_DB_PASSWORD
            - name: MP_UNSET_midpoint_repository_hibernateHbm2ddl
              value: "1"
            - name: MP_NO_ENV_COMPAT
              value: "1"
            - name: MP_MEM_INIT
              value: 512m
            - name: MP_MEM_MAX
              value: 1536m
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2560Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: midpoint-home
              mountPath: /opt/midpoint/var
      volumes:
        - name: midpoint-home
          persistentVolumeClaim:
            claimName: smartaccess-midpoint-home
