apiVersion: batch/v1
kind: Job
metadata:
  name: smartaccess-midpoint-init
  namespace: smartaccess-dev
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: smartaccess-worker03
      containers:
        - name: midpoint-init
          image: evolveum/midpoint:4.11.1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - |
              cd /opt/midpoint
              bin/midpoint.sh init-native
              bin/ninja.sh run-sql --create --mode REPOSITORY
              bin/ninja.sh run-sql --create --mode AUDIT
          env:
            - name: MP_SET_midpoint_repository_database
              value: postgresql
            - name: MP_SET_midpoint_repository_jdbcUsername
              value: midpoint
            - name: MP_SET_midpoint_repository_jdbcUrl
              value: jdbc:postgresql://smartaccess-postgresql.smartaccess-dev.svc.cluster.local:5432/midpoint
            - name: MP_SET_midpoint_repository_jdbcPassword
              valueFrom:
                secretKeyRef:
                  name: smartaccess-postgresql-credentials
                  key: MIDPOINT_DB_PASSWORD
            - name: MP_INIT_CFG
              value: /opt/midpoint/var
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: midpoint-home
              mountPath: /opt/midpoint/var
      volumes:
        - name: midpoint-home
          persistentVolumeClaim:
            claimName: smartaccess-midpoint-home
